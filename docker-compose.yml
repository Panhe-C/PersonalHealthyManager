services:
  postgres:
    image: postgres:16
    container_name: hbm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hbm
      POSTGRES_PASSWORD: hbm
      POSTGRES_DB: hbm
    ports:
      - "5432:5432"
    volumes:
      - hbm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbm -d hbm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hbm-postgres-data:
